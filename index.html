<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手機影片多張截圖工具</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md py-4 px-6 sticky top-0 z-20">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <h1 class="text-lg font-bold tracking-wide flex items-center gap-2">
                🎬 手機影片多張截圖工具
            </h1>
            <span class="text-xs bg-indigo-500/80 px-2.5 py-1 rounded-full font-medium">支援 iPhone / Android</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-xl w-full mx-auto p-4 sm:p-6 space-y-6 pb-12">

        <!-- Custom Notification Modal / Banner -->
        <div id="toast" class="hidden bg-amber-50 border border-amber-200 text-amber-800 px-4 py-3 rounded-xl text-sm flex items-start gap-3 shadow-sm transition-all">
            <span class="text-lg">⚠️</span>
            <div id="toast-message" class="flex-1">提示訊息</div>
            <button onclick="hideToast()" class="text-amber-500 hover:text-amber-700 font-bold px-1">&times;</button>
        </div>

        <!-- Step 1: Upload Video -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-4">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Step 1. 上傳影片 (限 3 分鐘內)</h2>
            
            <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-200 hover:border-indigo-400 bg-slate-50 hover:bg-indigo-50/30 rounded-xl p-6 cursor-pointer transition-all">
                <div class="w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center mb-2 shadow-sm">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </div>
                <span id="upload-text" class="text-sm font-medium text-slate-700">點擊選擇影片檔案</span>
                <span class="text-xs text-slate-400 mt-1">支援 MP4, MOV 等格式 (小於 3 分鐘)</span>
                <input type="file" id="video-input" accept="video/*" class="hidden">
            </label>

            <!-- Video Preview Container -->
            <div id="video-container" class="hidden space-y-3">
                <div class="relative rounded-xl overflow-hidden bg-black aspect-video flex items-center justify-center shadow-inner">
                    <video id="preview-video" class="max-h-64 w-auto mx-auto" playsinline muted preload="metadata"></video>
                </div>
                <div class="flex justify-between items-center text-xs text-slate-500 px-1">
                    <span>檔案名稱: <span id="file-name" class="font-medium text-slate-700"></span></span>
                    <span>總時長: <span id="video-duration" class="font-medium text-slate-700">0.00</span>s</span>
                </div>
            </div>
        </div>

        <!-- Step 2: Time Selection & Fine-tuning -->
        <div id="step-2" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-4 opacity-50 pointer-events-none transition-opacity">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Step 2. 挑選中心時間點</h2>
            
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label class="text-sm font-medium text-slate-700">目標時間點</label>
                    <span class="text-sm font-bold text-indigo-600 bg-indigo-50 px-2.5 py-0.5 rounded-md"><span id="current-time-display">0.00</span> 秒</span>
                </div>

                <!-- Slider with Fine-tune buttons -->
                <div class="flex items-center gap-3">
                    <button id="btn-minus" type="button" class="w-12 h-11 flex-shrink-0 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 rounded-xl font-medium text-xs flex flex-col items-center justify-center transition-colors shadow-sm">
                        <span>-1</span>
                        <span class="text-[10px] text-slate-400">frame</span>
                    </button>
                    
                    <input type="range" id="time-slider" min="0" max="180" step="0.01" value="0" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                    
                    <button id="btn-plus" type="button" class="w-12 h-11 flex-shrink-0 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 rounded-xl font-medium text-xs flex flex-col items-center justify-center transition-colors shadow-sm">
                        <span>+1</span>
                        <span class="text-[10px] text-slate-400">frame</span>
                    </button>
                </div>
                <p class="text-xs text-slate-400 text-center">提示：拉動滑桿或點擊按鈕微調影格（截圖範圍為前後各 0.1 秒）</p>
            </div>

            <!-- Step 3: Frame Count Setting -->
            <div class="pt-3 border-t border-slate-100 space-y-3">
                <div class="flex justify-between items-center">
                    <label class="text-sm font-medium text-slate-700">分割張數設定 <span class="text-xs text-slate-400">(上限 20 張)</span></label>
                    <span class="text-sm font-bold text-indigo-600 bg-indigo-50 px-2.5 py-0.5 rounded-md"><span id="frame-count-display">10</span> 張</span>
                </div>
                <input type="range" id="frame-count-slider" min="1" max="20" value="10" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
            </div>

            <!-- Execute Button -->
            <button id="btn-execute" type="button" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold py-3.5 px-6 rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                開始執行截圖
            </button>
        </div>

        <!-- Processing Indicator -->
        <div id="loading-box" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-8 text-center space-y-3">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent"></div>
            <p id="loading-status" class="text-sm font-medium text-slate-600">正在擷取畫格中 (0/0)...</p>
        </div>

        <!-- Step 4: Results Gallery -->
        <div id="results-section" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 p-5 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Step 3. 截圖成果 (可點擊下載或長按圖片儲存)</h2>
                <span id="result-count" class="text-xs bg-emerald-50 text-emerald-700 font-medium px-2 py-0.5 rounded-md">已完成</span>
            </div>
            
            <!-- Gallery Grid -->
            <div id="gallery-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <!-- Dynamically injected images -->
            </div>
        </div>

    </main>

    <!-- Hidden Canvas for frame capture -->
    <canvas id="capture-canvas" class="hidden"></canvas>

    <script>
        const videoInput = document.getElementById('video-input');
        const uploadText = document.getElementById('upload-text');
        const videoContainer = document.getElementById('video-container');
        const previewVideo = document.getElementById('preview-video');
        const fileNameSpan = document.getElementById('file-name');
        const videoDurationSpan = document.getElementById('video-duration');
        
        const step2 = document.getElementById('step-2');
        const timeSlider = document.getElementById('time-slider');
        const currentTimeDisplay = document.getElementById('current-time-display');
        const btnMinus = document.getElementById('btn-minus');
        const btnPlus = document.getElementById('btn-plus');
        
        const frameCountSlider = document.getElementById('frame-count-slider');
        const frameCountDisplay = document.getElementById('frame-count-display');
        
        const btnExecute = document.getElementById('btn-execute');
        const loadingBox = document.getElementById('loading-box');
        const loadingStatus = document.getElementById('loading-status');
        
        const resultsSection = document.getElementById('results-section');
        const galleryGrid = document.getElementById('gallery-grid');
        const resultCount = document.getElementById('result-count');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');
        const captureCanvas = document.getElementById('capture-canvas');

        let videoDuration = 0;
        let originalFileName = "video_frame";
        const FRAME_TIME = 1 / 30; // 假設標準 30fps，一畫格約為 0.0333 秒

        function showToast(msg) {
            toastMessage.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => hideToast(), 5000);
        }

        function hideToast() {
            toast.classList.add('hidden');
        }

        // Handle Video Upload
        videoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('video/')) {
                showToast('請上傳有效的影片檔案格式！');
                return;
            }

            // Extract base file name without extension
            const fullFileName = file.name;
            originalFileName = fullFileName.substring(0, fullFileName.lastIndexOf('.')) || fullFileName;
            
            fileNameSpan.textContent = file.name;
            uploadText.textContent = '更換影片';
            
            const fileURL = URL.createObjectURL(file);
            previewVideo.src = fileURL;
            
            previewVideo.onloadedmetadata = function() {
                videoDuration = previewVideo.duration;
                videoDurationSpan.textContent = videoDuration.toFixed(2);

                if (videoDuration > 180.5) {
                    showToast('⚠️ 警告：影片長度超過 3 分鐘 (180 秒)，請限制在 3 分鐘以內！');
                    return;
                }

                // Setup Sliders
                timeSlider.max = videoDuration;
                timeSlider.step = 0.001; // finer step precision for frame calculations
                
                // Default target time to middle of video or 0
                const defaultTime = Math.min(videoDuration / 2, 5);
                timeSlider.value = defaultTime;
                previewVideo.currentTime = defaultTime;
                currentTimeDisplay.textContent = defaultTime.toFixed(2);

                // Enable step 2
                step2.classList.remove('opacity-50', 'pointer-events-none');
                videoContainer.classList.remove('hidden');
                resultsSection.classList.add('hidden');
            };
        });

        // Time Slider Event
        timeSlider.addEventListener('input', function() {
            const val = parseFloat(this.value);
            currentTimeDisplay.textContent = val.toFixed(2);
            previewVideo.currentTime = val;
        });

        // Fine-tune buttons by Frame (1 frame ≈ 0.0333s)
        btnMinus.addEventListener('click', function() {
            let val = Math.max(0, parseFloat(timeSlider.value) - FRAME_TIME);
            timeSlider.value = val;
            currentTimeDisplay.textContent = val.toFixed(2);
            previewVideo.currentTime = val;
        });

        btnPlus.addEventListener('click', function() {
            let val = Math.min(videoDuration, parseFloat(timeSlider.value) + FRAME_TIME);
            timeSlider.value = val;
            currentTimeDisplay.textContent = val.toFixed(2);
            previewVideo.currentTime = val;
        });

        // Frame Count Slider
        frameCountSlider.addEventListener('input', function() {
            frameCountDisplay.textContent = this.value;
        });

        // Helper to seek video accurately using promise & seeked event
        const seekVideoToTime = (video, time) => {
            return new Promise((resolve) => {
                const onSeeked = () => {
                    video.removeEventListener('seeked', onSeeked);
                    // Small timeout for mobile browser rendering stability
                    setTimeout(resolve, 50);
                };
                video.addEventListener('seeked', onSeeked);
                video.currentTime = Math.max(0, Math.min(video.duration, time));
            });
        };

        // Execute capture process
        btnExecute.addEventListener('click', async function() {
            const targetTime = parseFloat(timeSlider.value);
            const frameCount = parseInt(frameCountSlider.value, 10);

            // Calculate 0.2-second window: targetTime ± 0.1s, clamped to video duration
            let start = targetTime - 0.1;
            let end = targetTime + 0.1;

            if (start < 0) {
                end = Math.min(videoDuration, end - start);
                start = 0;
            }
            if (end > videoDuration) {
                start = Math.max(0, start - (end - videoDuration));
                end = videoDuration;
            }
            start = Math.max(0, start);
            end = Math.min(videoDuration, end);

            // Generate timestamps array
            const timestamps = [];
            if (frameCount === 1) {
                timestamps.push(targetTime);
            } else {
                for (let i = 0; i < frameCount; i++) {
                    let t = start + (i / (frameCount - 1)) * (end - start);
                    timestamps.push(t);
                }
            }

            // Show loading
            loadingBox.classList.remove('hidden');
            resultsSection.classList.add('hidden');
            galleryGrid.innerHTML = '';
            btnExecute.disabled = true;
            btnExecute.classList.add('opacity-50');

            // Setup Canvas resolution matching original video specs
            captureCanvas.width = previewVideo.videoWidth || 1280;
            captureCanvas.height = previewVideo.videoHeight || 720;
            const ctx = captureCanvas.getContext('2d');

            const capturedImages = [];

            try {
                for (let i = 0; i < timestamps.length; i++) {
                    const t = timestamps[i];
                    loadingStatus.textContent = `正在擷取畫格中 (${i + 1}/${timestamps.length})...`;
                    
                    await seekVideoToTime(previewVideo, t);
                    
                    // Draw frame onto canvas
                    ctx.drawImage(previewVideo, 0, 0, captureCanvas.width, captureCanvas.height);
                    const dataUrl = captureCanvas.toDataURL('image/jpeg', 0.92);
                    
                    // Generate formatted index string (01, 02, etc.)
                    const seqIndex = String(i + 1).padStart(2, '0');
                    const downloadFileName = `${originalFileName}_frame_${seqIndex}.jpg`;

                    capturedImages.push({
                        time: t.toFixed(2),
                        url: dataUrl,
                        fileName: downloadFileName,
                        index: seqIndex
                    });
                }

                // Render gallery
                galleryGrid.innerHTML = '';
                capturedImages.forEach((imgData) => {
                    const card = document.createElement('div');
                    card.className = 'bg-slate-50 border border-slate-200 rounded-xl overflow-hidden shadow-xs flex flex-col justify-between';
                    card.innerHTML = `
                        <div class="relative bg-black aspect-video flex items-center justify-center overflow-hidden">
                            <img src="${imgData.url}" alt="Frame ${imgData.index}" class="w-full h-full object-contain select-none" />
                        </div>
                        <div class="p-2 bg-white space-y-1.5">
                            <div class="flex justify-between items-center text-xs">
                                <span class="font-semibold text-slate-700">#${imgData.index}</span>
                                <span class="text-indigo-600 font-medium">${imgData.time}s</span>
                            </div>
                            <a href="${imgData.url}" download="${imgData.fileName}" class="block text-center w-full bg-slate-100 hover:bg-indigo-50 text-slate-700 hover:text-indigo-600 font-medium py-1 px-2 rounded-lg text-xs transition-colors truncate">
                                ⬇️ ${imgData.fileName}
                            </a>
                        </div>
                    `;
                    galleryGrid.appendChild(card);
                });

                resultCount.textContent = `已完成 ${capturedImages.length} 張`;
                resultsSection.classList.remove('hidden');
                
                // Smooth scroll to results
                resultsSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            } catch (err) {
                console.error(err);
                showToast('截圖過程中發生錯誤，請重新整理後再試一次。');
            } finally {
                loadingBox.classList.add('hidden');
                btnExecute.disabled = false;
                btnExecute.classList.remove('opacity-50');
            }
        });
    </script>
</body>
</html>
